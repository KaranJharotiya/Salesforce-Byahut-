<template>
  <template lwc:if={showPrompt}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
      <div class="slds-modal__container">
        <header class="slds-modal__header slds-theme_warning slds-theme_alert-texture">
          <h2 class="slds-text-heading_medium">Submit for Approval</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p>Are you sure you want to submit this Purchase Request for approval?</p>
        </div>
        <footer class="slds-modal__footer slds-grid slds-grid_align-end slds-grid_vertical-align-center">
          <lightning-button label="Cancel" variant="neutral" onclick={handleCancel}>
          </lightning-button>
          <lightning-button label="Submit" variant="brand" onclick={handleConfirm} class="slds-m-left_x-small">
          </lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
  </template>
</template>
