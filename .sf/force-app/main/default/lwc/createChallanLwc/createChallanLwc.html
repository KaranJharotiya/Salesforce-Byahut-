<template>
    <div class="slds-scope">
        <div class="custom-container">

            <!-- Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
            <!-- Custom Toast Error Message near Title -->
            <template if:true={lineItemError}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-left_small slds-p-around_x-small"
                    style="border-radius: 4px;" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2 class="slds-text-body_small">{lineItemError}</h2>
                </div>
            </template>

            <!-- Error Banner -->
            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium"
                    role="alert">
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <!-- Main Form Card -->
            <template if:true={isValid}>
                <article class="slds-card slds-shadow_medium slds-card_boundary">

                    <!-- Header -->
                    <div class="slds-card__header slds-grid slds-p-around_medium card-header-bg">
                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:orders" size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h2 class="slds-card__header-title">
                                    <span class="slds-text-heading_medium slds-truncate font-bold">Create Challan</span>
                                </h2>
                                <p class="slds-text-body_small slds-text-color_weak">Provide transit, shipping details
                                    and select line items to generate challan.</p>
                            </div>
                        </header>
                    </div>

                    <!-- Card Body -->
                    <div class="slds-card__body slds-card__body_inner slds-p-around_large">

                        <!-- Opportunity Info -->
                        <div class="slds-grid slds-wrap slds-m-bottom_large">
                            <div class="slds-col slds-size_1-of-1">
                                <div class="info-pill slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div>
                                        <span class="slds-text-title_bold slds-m-right_x-small">Linked
                                            Opportunity:</span>
                                        <span
                                            class="slds-text-body_regular slds-text-color_default">{opportunityName}</span>
                                    </div>
                                    <span class="slds-badge slds-theme_success">{selectedLineItemIds.length} Item(s)
                                        Selected</span>
                                </div>
                            </div>
                        </div>

                        <!-- Input Fields Grid -->
                        <div class="slds-grid slds-wrap slds-gutters">

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_medium">
                                <lightning-combobox name="wayOfTransit" label="Way of Transit" value={selectedTransit}
                                    placeholder="--None--" options={transitOptions} onchange={handleTransitChange}
                                    required>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_medium">
                                <lightning-textarea name="address" label="Shipping / Delivery Address"
                                    placeholder="Enter delivery address..." value={address}
                                    onchange={handleAddressChange}>
                                </lightning-textarea>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                                <lightning-textarea name="specialInstructions" label="Special Instructions"
                                    placeholder="Enter special instructions..." value={specialInstructions}
                                    onchange={handleSpecialInstructionsChange}>
                                </lightning-textarea>
                            </div>
                        </div>

                        <!-- Selectable Line Items Section -->
                        <div class="slds-m-top_medium">
                            <h3 class="slds-text-title_caps slds-m-bottom_small table-header-title">
                                Select Sales Order Line Items
                            </h3>
                            <div
                                class="slds-table_bordered slds-border_left slds-border_right slds-border_top table-container slds-scrollable_x">
                                <table class="slds-table slds-table_cell-buffer slds-table_striped">
                                    <thead>
                                        <tr class="slds-line-height_reset table-head-bg">
                                            <th scope="col" style="width: 3.25rem;" class="slds-text-align_right">
                                                <lightning-input type="checkbox" checked={isAllSelected}
                                                    onchange={handleSelectAll}></lightning-input>
                                            </th>
                                            <th scope="col">
                                                <div class="slds-truncate" title="Line Item">Item Name</div>
                                            </th>
                                            <th scope="col">
                                                <div class="slds-truncate" title="Sales Order">Sales Order</div>
                                            </th>
                                            <th scope="col">
                                                <div class="slds-truncate" title="Product">Product</div>
                                            </th>
                                            <th scope="col">
                                                <div class="slds-truncate" title="Quantity">Quantity</div>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={lineItems} for:item="item">
                                            <tr key={item.Id} class="slds-hint-parent">
                                                <td class="slds-text-align_right">
                                                    <lightning-input type="checkbox" data-id={item.Id}
                                                        checked={item.selected}
                                                        onchange={handleItemSelect}></lightning-input>
                                                </td>
                                                <td data-label="Line Item">
                                                    <div class="slds-truncate font-semibold">{item.Name}</div>
                                                </td>
                                                <td data-label="Sales Order">
                                                    <div class="slds-truncate">{item.Sales_Order__r.Name}</div>
                                                </td>
                                                <td data-label="Product">
                                                    <div class="slds-truncate">{item.Product__r.Name}</div>
                                                </td>
                                                <td data-label="Quantity">
                                                    <div class="slds-truncate">{item.Quantity__c}</div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>

                    <!-- Footer Actions -->
                    <footer class="slds-card__footer slds-grid slds-grid_align-end slds-p-around_medium card-footer-bg">
                        <lightning-button label="Cancel" onclick={handleCancel} disabled={challanFromHome}
                            class="slds-m-right_small"></lightning-button>
                        <lightning-button variant="brand" label="Save" onclick={handleSave}></lightning-button>
                    </footer>
                </article>
            </template>

            <!-- Error State Card -->
            <template if:true={isErrorState}>
                <article class="slds-card slds-shadow_medium slds-card_boundary">
                    <div class="slds-card__body slds-card__body_inner slds-p-around_large slds-text-align_center">
                        <div class="slds-text-heading_medium slds-text-color_error slds-m-bottom_small font-bold">
                            Action Required
                        </div>
                        <p class="slds-text-body_regular slds-m-bottom_large">
                            Please review the error messages above before proceeding.
                        </p>
                        <lightning-button variant="brand" label="Back to Sales Orders"
                            onclick={handleCancel} disabled={challanFromHome}></lightning-button>
                    </div>
                </article>
            </template>
        </div>
    </div>
</template>
