<template>
    <div class="slds-var-p-around_x-small">

        <!-- Progress bar per status -->
        <lightning-card title={cardTitle} icon-name="standard:orders">
            <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
                <template for:each={statusSummary} for:item="s">
                    <div key={s.status} class={s.rowClass} onclick={handleStatusClick} data-status={s.status}>
                        <div class="slds-grid slds-grid_align-spread slds-var-p-bottom_xx-small">
                            <span class="slds-text-body_small slds-text-heading_small">{s.status}</span>
                            <span class="slds-text-body_small slds-text-color_weak">{s.countLabel}</span>
                        </div>
                        <lightning-progress-bar value={s.percent} size="medium"></lightning-progress-bar>
                    </div>
                </template>
            </div>

            <template if:true={hasActiveFilter}>
                <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
                    <lightning-badge label={filterBadgeLabel}></lightning-badge>
                    <a href="javascript:void(0);" class="slds-var-m-left_small slds-text-link" onclick={clearFilter}>Clear filter</a>
                </div>
            </template>
        </lightning-card>

        <!-- Orders below -->
        <lightning-card title={moduleLabel} icon-name="standard:orders" class="slds-var-m-top_medium">
            <div class="datatable-container">
                <lightning-datatable
                    key-field="id"
                    data={filteredOrders}
                    columns={columns}
                    hide-checkbox-column="true">
                </lightning-datatable>
            </div>
            <template if:false={hasOrders}>
                <div class="slds-var-p-around_medium slds-text-align_center slds-text-color_weak">
                    No orders to show.
                </div>
            </template>
        </lightning-card>

    </div>
</template>
